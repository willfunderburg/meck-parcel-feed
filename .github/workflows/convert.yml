name: Convert Meck Parcel Sales to GeoJSON

on:
  schedule:
    - cron: "15 10 * * 1"   # every Monday 10:15 UTC
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -e
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin unzip curl

      - name: Download shapefile zip
        run: |
          set -e
          mkdir -p data
          cd data
          curl -fL -o Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"

      - name: Unzip shapefile
        run: |
          set -e
          cd data
          unzip -o Parcel_Sales.zip

      - name: Convert to GeoJSON (reproject to WGS84)
        run: |
          set -e
          cd data
          SHP_FILE=$(ls *.shp | head -n1)
          # Meck shapefiles are usually EPSG:2264; reproject to 4326
          ogr2ogr -f GeoJSON -s_srs EPSG:2264 -t_srs EPSG:4326 parcel_sales.geojson "$SHP_FILE"

      # Keep full attribute set to avoid field-name mismatches
      - name: Trim fields (optional)
        run: |
          set -e
          cd data
          cp parcel_sales.geojson parcel_sales_min.geojson

      - name: Prepare public folder
        run: |
          set -e
          mkdir -p public
          mv data/parcel_sales_min.geojson public/parcel_sales.geojson

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions
