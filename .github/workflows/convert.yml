name: Convert Meck Parcel Sales to CSV (WGS84)

on:
  schedule:
    - cron: "15 10 * * 1"   # every Monday 10:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin unzip curl jq

      - name: Download shapefile zip
        run: |
          set -e
          mkdir -p data
          cd data
          curl -fL -o Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"

      - name: Unzip shapefile
        run: |
          set -e
          cd data
          unzip -o Parcel_Sales.zip

      - name: Reproject to WGS84 GeoJSON (temporary)
        run: |
          set -e
          cd data
          SHP_FILE=$(ls *.shp | head -n 1)
          # Meck data is EPSG:2264 (NAD83 / NCft), convert to 4326
          ogr2ogr -f GeoJSON -s_srs EPSG:2264 -t_srs EPSG:4326 parcel_sales.geojson "$SHP_FILE"

      - name: Export minimal CSV with lon/lat (latest per parcel, last 12 months, with address)
        run: |
          set -e
          cd data

          # Detect layer name in the GeoJSON
          LAYER=$(ogrinfo -ro -so parcel_sales.geojson | awk 'NR==1{print $3}')

          # Build the CSV using SQLite dialect and window functions
          ogr2ogr -f CSV parcel_sales.csv parcel_sales.geojson \
            -dialect SQLite \
            -sql "
WITH base AS (
  SELECT
    -- WGS84 coordinates (already 4326 above)
    CAST(ST_X(geometry) AS REAL) AS lon,
    CAST(ST_Y(geometry) AS REAL) AS lat,

    -- Pick a parcel identifier
    COALESCE(pid, parcelid, taxpid, commonpid, id_Common_Pid) AS pid,
    parcelid,

    -- Address assembly (adjust if field names differ)
    TRIM(COALESCE(streetnumber, housenumber, stnumber, '')) || ' ' ||
    TRIM(COALESCE(streetname, '')) AS address,

    COALESCE(city, loccity) AS city,
    zipcode,

    -- Sale date/price normalization (support multiple field names)
    COALESCE(saledate, dte_DateofSale) AS saledate_raw,
    CAST(REPLACE(COALESCE(saleprice, amt_Price), ',', '') AS REAL) AS saleprice,

    -- Normalize date to YYYY-MM-DD
    DATE(REPLACE(COALESCE(saledate, dte_DateofSale), '/', '-')) AS d
  FROM \"$LAYER\"
),
recent AS (
  SELECT *,
         ROW_NUMBER() OVER (PARTITION BY pid ORDER BY d DESC) AS rn
  FROM base
  WHERE d IS NOT NULL
)
SELECT lon, lat, pid, parcelid, address, city, zipcode,
       d AS saledate, saleprice
FROM recent
WHERE rn = 1                       -- latest sale per parcel
  AND d >= DATE('now','-12 months')
ORDER BY d DESC;
            "

      - name: Prepare public folder (CSV only)
        run: |
          set -e
          mkdir -p public
          mv -f data/parcel_sales.csv public/parcel_sales.csv

      - name: Commit and push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/parcel_sales.csv
          git commit -m "Auto-update parcel sales CSV (latest per parcel, last 12 months) [skip ci]" || echo "No changes to commit."
          git push
