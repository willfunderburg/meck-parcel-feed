name: Convert Meck Parcel Sales to CSV (WGS84)

on:
  schedule:
    - cron: "15 10 * * 1"   # every Monday 10:15 UTC
  workflow_dispatch:

# allow this workflow to push to the repo
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GDAL
        run: |
          set -e
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin unzip curl

      - name: Download shapefile zip
        run: |
          set -e
          mkdir -p data
          cd data
          curl -fL -o Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"

      - name: Unzip shapefile
        run: |
          set -e
          cd data
          unzip -o Parcel_Sales.zip

      - name: Detect layer name
        id: layer
        run: |
          set -e
          cd data
          # usually layer name == basename of .shp
          LAYER=$(ls *.shp | head -n1 | sed 's/\.shp$//')
          echo "layer=$LAYER" >> $GITHUB_OUTPUT

      - name: Reproject to WGS84 GeoJSON (temporary)
        run: |
          set -e
          cd data
          SHP_FILE="${{ steps.layer.outputs.layer }}.shp"
          # Mecklenburg data is typically EPSG:2264; convert to 4326 (WGS84)
          ogr2ogr -f GeoJSON -s_srs EPSG:2264 -t_srs EPSG:4326 parcel_sales.geojson "$SHP_FILE"

      - name: Export minimal CSV with lon/lat
        run: |
          set -e
          cd data
          # Export to CSV, include geometry as X,Y columns
          # Use a tolerant SELECT that works whether fields are named saleprice vs amt_Price, saledate vs dte_DateofSale, etc.
          ogr2ogr -f CSV parcel_sales.csv parcel_sales.geojson \
            -lco GEOMETRY=AS_XY \
            -dialect SQLite \
            -sql "
              SELECT
                X(geometry) AS lon,
                Y(geometry) AS lat,
                COALESCE(pid, parcelid, taxpid, commonpid)         AS pid,
                parcelid,
                streetnumber,
                streetname,
                city,
                zipcode,
                COALESCE(saledate, dte_DateofSale)                 AS saledate,
                COALESCE(saleprice, amt_Price)                     AS saleprice
              FROM 'parcel_sales'
            " || true

          # If the layer name isn't 'parcel_sales', fall back to real layer name
          if [ ! -s parcel_sales.csv ]; then
            LAYER="${{ steps.layer.outputs.layer }}"
            ogr2ogr -f CSV parcel_sales.csv parcel_sales.geojson \
              -lco GEOMETRY=AS_XY \
              -dialect SQLite \
              -sql "
                SELECT
                  X(geometry) AS lon,
                  Y(geometry) AS lat,
                  COALESCE(pid, parcelid, taxpid, commonpid)       AS pid,
                  parcelid,
                  streetnumber,
                  streetname,
                  city,
                  zipcode,
                  COALESCE(saledate, dte_DateofSale)               AS saledate,
                  COALESCE(saleprice, amt_Price)                   AS saleprice
                FROM '${LAYER}'
              "
          fi

      - name: Prepare public folder (CSV only)
        run: |
          set -e
          mkdir -p public
          mv data/parcel_sales.csv public/parcel_sales.csv

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/parcel_sales.csv
          git commit -m "Auto-update parcel sales CSV (lon/lat, attrs) [skip ci]" || echo "No changes to commit"
          git push
