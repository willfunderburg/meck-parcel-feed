name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # 01:00 ET summer / 00:00 ET winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download Parcel_Sales (ZIP or REST API)
        run: |
          set -euo pipefail
          mkdir -p data/shp data/mat public

          # --- Attempt 1: ZIP download ---
          TS="$(date +%s)"
          SALES_URLS=(
            "https://maps.mecklenburgcountync.gov/opendata/Parcel_Sales.zip?nocache=${TS}"
            "https://maps.mecknc.gov/opendata/Parcel_Sales.zip?nocache=${TS}"
          )

          ZIP_OK=false
          for URL in "${SALES_URLS[@]}"; do
            echo "Trying Parcel_Sales ZIP: ${URL}"
            if curl -fL --retry 3 --retry-delay 5 \
              -H "Cache-Control: no-cache" \
              -o data/Parcel_Sales.zip \
              "${URL}"; then
              echo "Downloaded Parcel_Sales from: ${URL}"
              unzip -o data/Parcel_Sales.zip -d data/shp
              echo "=== Files extracted from ZIP ==="
              ls -la data/shp/
              ZIP_OK=true
              break
            fi
          done

          if [[ "${ZIP_OK}" == "true" ]]; then
            echo "source=zip" > data/sales_source.txt
            exit 0
          fi

          echo "ZIP download failed from all URLs. Searching ArcGIS REST APIs..."

          # --- Attempt 2: Discover sales data via ArcGIS REST API ---
          # Dynamically enumerate all services in relevant folders
          ARC_ROOTS=(
            "https://edmsgis.mecklenburgcountync.gov/server/rest/services"
            "https://maps.mecklenburgcountync.gov/agsadaptor/rest/services"
            "https://gis.charlottenc.gov/arcgis/rest/services"
          )
          FOLDERS_TO_SEARCH=("" "GIS" "CountyData" "OpenData" "Property" "Tax")

          SALES_EP=""
          for ROOT in "${ARC_ROOTS[@]}"; do
            echo "=== Checking server: ${ROOT} ==="
            for FOLDER in "${FOLDERS_TO_SEARCH[@]}"; do
              if [[ -n "${FOLDER}" ]]; then
                CATALOG_URL="${ROOT}/${FOLDER}?f=json"
              else
                CATALOG_URL="${ROOT}?f=json"
              fi
              echo "  Listing folder: ${FOLDER:-(root)}"
              if ! curl -fsSL --max-time 10 -o data/catalog.json "${CATALOG_URL}" 2>/dev/null; then
                continue
              fi

              SERVICES=$(python3 -c "
          import json
          d = json.load(open('data/catalog.json'))
          if 'error' in d:
              exit()
          for f in d.get('folders', []):
              print(f'FOLDER:{f}')
          for s in d.get('services', []):
              n = s.get('name','')
              t = s.get('type','')
              print(f'SVC:{n}/{t}')
          " 2>/dev/null)
              [[ -z "${SERVICES}" ]] && continue
              echo "${SERVICES}" | head -30

              while IFS= read -r LINE; do
                [[ "${LINE}" != SVC:* ]] && continue
                SVC_PATH="${LINE#SVC:}"
                SVC_URL="${ROOT}/${SVC_PATH}"
                SVC_NAME_LOWER=$(echo "${SVC_PATH}" | tr '[:upper:]' '[:lower:]')

                if [[ "${SVC_NAME_LOWER}" != *parcel* && "${SVC_NAME_LOWER}" != *sale* && \
                      "${SVC_NAME_LOWER}" != *propert* && "${SVC_NAME_LOWER}" != *tax* && \
                      "${SVC_NAME_LOWER}" != *real* && "${SVC_NAME_LOWER}" != *cama* ]]; then
                  continue
                fi
                echo "    Probing service: ${SVC_URL}"
                if ! curl -fsSL --max-time 10 -o data/svc_probe.json "${SVC_URL}?f=json" 2>/dev/null; then
                  continue
                fi
                LAYERS=$(python3 -c "
          import json
          d = json.load(open('data/svc_probe.json'))
          if 'error' in d: exit()
          for l in d.get('layers', []):
              print(f\"{l['id']}:{l.get('name','')}\")
          " 2>/dev/null)
                [[ -z "${LAYERS}" ]] && continue
                echo "      Layers: ${LAYERS}"

                while IFS=: read -r LID LNAME; do
                  QUERY_URL="${SVC_URL}/${LID}/query"
                  if curl -fsSL --max-time 15 -o data/layer_probe.json \
                    "${QUERY_URL}?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultRecordCount=1" 2>/dev/null; then
                    HAS_SALES=$(python3 -c "
          import json
          d = json.load(open('data/layer_probe.json'))
          feats = d.get('features', [])
          if not feats: print('no'); exit()
          flds = list(feats[0].get('attributes', {}).keys())
          print('Fields: ' + ', '.join(flds[:20]))
          sale = [f for f in flds if any(k in f.lower() for k in ['sale','price','transfer','deed'])]
          pid = [f for f in flds if any(k in f.lower() for k in ['parcel','pid','pin'])]
          if sale: print('Sale fields: ' + ', '.join(sale))
          if pid: print('Parcel fields: ' + ', '.join(pid))
          print('yes' if sale and pid else 'no')
          " 2>/dev/null)
                    echo "      Layer ${LID} (${LNAME}): ${HAS_SALES}"
                    if [[ "${HAS_SALES}" == *$'\n'"yes" || "${HAS_SALES}" == "yes" ]]; then
                      SALES_EP="${QUERY_URL}"
                      echo "Found sales endpoint: ${SALES_EP} (layer ${LID}: ${LNAME})"
                      break 4
                    fi
                  fi
                done <<< "${LAYERS}"
              done <<< "${SERVICES}"
            done
          done

          if [[ -z "${SALES_EP}" ]]; then
            echo "::error ::No Parcel_Sales source available (ZIP 404, no REST API with sales data found)."
            echo "Searched ${#ARC_ROOTS[@]} servers x ${#FOLDERS_TO_SEARCH[@]} folders."
            exit 1
          fi

          # --- Paginated REST API download ---
          echo "Downloading sales data from REST API: ${SALES_EP}"
          BATCH=2000
          OFFSET=0
          TOTAL=0

          while true; do
            API_URL="${SALES_EP}?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultOffset=${OFFSET}&resultRecordCount=${BATCH}"
            echo "Fetching sales batch: offset=${OFFSET} ..."
            if ! curl -fL --retry 2 --retry-delay 3 --max-time 120 \
              -o data/sales_batch.json "${API_URL}"; then
              echo "::warning ::REST API request failed at offset ${OFFSET}."
              break
            fi
            echo "Response: $(wc -c < data/sales_batch.json) bytes"

            FEAT_COUNT=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('data/sales_batch.json'))
              if 'error' in d: print('API error: ' + json.dumps(d['error']), file=sys.stderr)
              print(len(d.get('features', [])))
          except Exception as e:
              print(0)
          ")
            if (( FEAT_COUNT == 0 )); then
              echo "No more features. Done."
              break
            fi

            if (( TOTAL == 0 )); then
              ogr2ogr -f GPKG data/sales.gpkg data/sales_batch.json \
                -t_srs EPSG:4326 -nln sales -overwrite
            else
              ogr2ogr -f GPKG data/sales.gpkg data/sales_batch.json \
                -t_srs EPSG:4326 -nln sales -append
            fi
            TOTAL=$((TOTAL + FEAT_COUNT))
            OFFSET=$((OFFSET + BATCH))

            EXCEEDED=$(python3 -c "
          import json
          d = json.load(open('data/sales_batch.json'))
          print('true' if d.get('exceededTransferLimit', False) else 'false')
          ")
            [[ "${EXCEEDED}" != "true" ]] && break
          done

          echo "Total sales records from REST API: ${TOTAL}"
          if (( TOTAL == 0 )); then
            echo "::error ::No sales records loaded."
            exit 1
          fi
          echo "source=rest" > data/sales_source.txt

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          if [[ -f data/sales_source.txt ]] && grep -q "source=rest" data/sales_source.txt; then
            echo "Sales data already in GPKG from REST API. Skipping reproject."
            exit 0
          fi
          echo "=== Available shapefiles ==="
          ls -la data/shp/*.shp
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          echo "Using shapefile: ${SHP_FILE}"
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Inspect sales fields
        run: |
          echo "=== Sales layer schema ==="
          ogrinfo -ro -so -al data/sales.gpkg sales

      - name: Check source staleness (warn-only)
        run: |
          set -euo pipefail
          MAX_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(substr(saledate, 1, 10)) FROM sales;")
          if [[ -z "${MAX_DATE:-}" || "${MAX_DATE}" == "NULL" ]]; then
            echo "::warning ::Couldn't determine MAX(saledate) from source."
          else
            NOW_UTC=$(date -u +%s)
            MAX_EPOCH=$(date -u -d "$MAX_DATE" +%s)
            AGE_DAYS=$(( (NOW_UTC - MAX_EPOCH) / 86400 ))
            echo "MAX(saledate)=${MAX_DATE}  age=${AGE_DAYS}d"
            if (( AGE_DAYS > 3 )); then
              echo "::warning ::Source dataset appears stale (MAX(saledate)=${MAX_DATE}, ${AGE_DAYS} days old). Proceeding anyway."
            fi
          fi

      - name: Probe REST API for fresh sales data (if ZIP is stale)
        id: sales_probe
        run: |
          set -euo pipefail
          MAX_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(substr(saledate,1,10)) FROM sales;")
          NOW_UTC=$(date -u +%s)
          MAX_EPOCH=$(date -u -d "$MAX_DATE" +%s 2>/dev/null || echo 0)
          AGE_DAYS=$(( (NOW_UTC - MAX_EPOCH) / 86400 ))

          if (( AGE_DAYS <= 90 )); then
            echo "ZIP data is fresh enough (${AGE_DAYS} days old). Skipping REST probe."
            echo "use_rest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ZIP data is ${AGE_DAYS} days stale (max=${MAX_DATE}). Probing REST APIs for fresh sales data..."

          # Endpoints to probe for sales data (layer 2 = Tax Parcels on MAT MapServer)
          SALES_REST_ENDPOINTS=(
            "https://edmsgis.mecklenburgcountync.gov/server/rest/services/GIS/MAT/MapServer/2/query"
            "https://maps.mecklenburgcountync.gov/agsadaptor/rest/services/GIS/MAT/MapServer/2/query"
            "https://gis.charlottenc.gov/arcgis/rest/services/CountyData/Parcels/MapServer/0/query"
          )

          for EP in "${SALES_REST_ENDPOINTS[@]}"; do
            echo "Probing: ${EP}"
            if curl -fsSL --max-time 15 \
              -o data/sales_probe.json \
              "${EP}?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultRecordCount=1"; then
              PROBE_INFO=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('data/sales_probe.json'))
              feats = d.get('features', [])
              if not feats:
                  print('no_features')
                  sys.exit(0)
              fields = list(feats[0].get('attributes', {}).keys())
              print('Fields: ' + ', '.join(fields))
              # Check for sales-related fields
              sales_fields = [f for f in fields if any(kw in f.lower() for kw in ['sale', 'price', 'transfer'])]
              if sales_fields:
                  print('SALES_FIELDS: ' + ', '.join(sales_fields))
              else:
                  print('NO_SALES_FIELDS')
          except Exception as e:
              print('error: ' + str(e))
          " 2>&1)
              echo "${PROBE_INFO}"
              if [[ "${PROBE_INFO}" == *"SALES_FIELDS:"* ]]; then
                echo "Found REST endpoint with sales data: ${EP}"
                echo "use_rest=true" >> "$GITHUB_OUTPUT"
                echo "rest_url=${EP}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "  (unreachable or error)"
            fi
          done

          echo "No REST API with sales fields found. Using ZIP data as-is."
          echo "use_rest=false" >> "$GITHUB_OUTPUT"

      - name: Detect address fields in sales layer
        id: detect_fields
        run: |
          set -euo pipefail
          FIELDS=$(sqlite3 data/sales.gpkg "PRAGMA table_info(sales);" | cut -d'|' -f2 | tr '\n' ',' )
          echo "Available fields: ${FIELDS}"

          HAS_ADDR=$(sqlite3 data/sales.gpkg "
            SELECT COUNT(*) FROM pragma_table_info('sales')
            WHERE lower(name) IN ('site_addr','siteaddres','siteaddress','site_address','address','full_addre','propaddr','location_a','street_add')
          ")
          HAS_CITY=$(sqlite3 data/sales.gpkg "
            SELECT COUNT(*) FROM pragma_table_info('sales')
            WHERE lower(name) IN ('city','nme_city','site_city','citydesc','city_name')
          ")
          HAS_ZIP=$(sqlite3 data/sales.gpkg "
            SELECT COUNT(*) FROM pragma_table_info('sales')
            WHERE lower(name) IN ('zipcode','zip','zip_code','cde_zip1','site_zip','postalcode')
          ")

          echo "has_addr=${HAS_ADDR}"
          echo "has_city=${HAS_CITY}"
          echo "has_zip=${HAS_ZIP}"

          if (( HAS_ADDR > 0 )); then
            ADDR_FIELD=$(sqlite3 data/sales.gpkg "
              SELECT name FROM pragma_table_info('sales')
              WHERE lower(name) IN ('site_addr','siteaddres','siteaddress','site_address','address','full_addre','propaddr','location_a','street_add')
              LIMIT 1
            ")
            echo "addr_field=${ADDR_FIELD}" >> "$GITHUB_OUTPUT"
          fi
          if (( HAS_CITY > 0 )); then
            CITY_FIELD=$(sqlite3 data/sales.gpkg "
              SELECT name FROM pragma_table_info('sales')
              WHERE lower(name) IN ('city','nme_city','site_city','citydesc','city_name')
              LIMIT 1
            ")
            echo "city_field=${CITY_FIELD}" >> "$GITHUB_OUTPUT"
          fi
          if (( HAS_ZIP > 0 )); then
            ZIP_FIELD=$(sqlite3 data/sales.gpkg "
              SELECT name FROM pragma_table_info('sales')
              WHERE lower(name) IN ('zipcode','zip','zip_code','cde_zip1','site_zip','postalcode')
              LIMIT 1
            ")
            echo "zip_field=${ZIP_FIELD}" >> "$GITHUB_OUTPUT"
          fi

          if (( HAS_ADDR > 0 )); then
            echo "strategy=sales_direct" >> "$GITHUB_OUTPUT"
            echo "Address fields found in Parcel_Sales — will use directly (no MAT needed)."
          else
            echo "strategy=needs_mat" >> "$GITHUB_OUTPUT"
            echo "No address fields in Parcel_Sales — will attempt MAT download."
          fi

      - name: Download MAT (if needed for addresses)
        if: steps.detect_fields.outputs.strategy == 'needs_mat'
        id: mat_download
        run: |
          set -euo pipefail

          # --- Attempt 1: ZIP download ---
          TS="$(date +%s)"
          MAT_URLS=(
            "https://maps.mecklenburgcountync.gov/opendata/MAT.zip?nocache=${TS}"
            "https://maps.mecknc.gov/opendata/MAT.zip?nocache=${TS}"
          )

          ZIP_OK=false
          for URL in "${MAT_URLS[@]}"; do
            echo "Trying MAT ZIP download: ${URL}"
            if curl -fL --retry 3 --retry-delay 5 \
              -H "Cache-Control: no-cache" \
              -o data/MAT.zip \
              "${URL}"; then
              echo "Downloaded MAT ZIP from: ${URL}"
              unzip -o data/MAT.zip -d data/mat
              MAT_SHP=$(ls data/mat/*.shp 2>/dev/null | head -n 1)
              if [[ -n "${MAT_SHP}" ]]; then
                echo "Using MAT shapefile: ${MAT_SHP}"
                ogr2ogr -f GPKG data/sales.gpkg "$MAT_SHP" -t_srs EPSG:4326 -nln mat -append
                ZIP_OK=true
              fi
              break
            fi
          done

          if [[ "${ZIP_OK}" == "true" ]]; then
            echo "mat_available=true" >> "$GITHUB_OUTPUT"
            echo "=== MAT layer schema ==="
            ogrinfo -ro -so -al data/sales.gpkg mat
            exit 0
          fi

          echo "MAT ZIP unavailable from all URLs. Falling back to ArcGIS REST API..."

          # --- Attempt 2: ArcGIS REST API with pagination ---
          REST_ENDPOINTS=(
            "https://edmsgis.mecklenburgcountync.gov/server/rest/services/GIS/MAT/MapServer/0/query"
            "https://maps.mecklenburgcountync.gov/agsadaptor/rest/services/GIS/MAT/MapServer/0/query"
            "https://gis.charlottenc.gov/arcgis/rest/services/Accela/Accela/MapServer/1/query"
          )
          BATCH=2000

          # Find a working REST endpoint by fetching 1 record with all fields
          BASE_URL=""
          for EP in "${REST_ENDPOINTS[@]}"; do
            echo "Testing REST endpoint: ${EP}"
            if curl -fsSL --max-time 15 \
              -o data/mat_probe.json \
              "${EP}?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultRecordCount=1"; then
              PROBE_COUNT=$(python3 -c "
          import json
          d = json.load(open('data/mat_probe.json'))
          feats = d.get('features', [])
          print(len(feats))
          if feats:
              print('Fields: ' + ', '.join(feats[0].get('attributes', {}).keys()), flush=True)
          " 2>&1)
              echo "Probe result: ${PROBE_COUNT}"
              if [[ "${PROBE_COUNT}" == *"Fields:"* ]]; then
                BASE_URL="${EP}"
                echo "Using REST endpoint: ${BASE_URL}"
                break
              fi
            fi
            echo "Endpoint unavailable or returned no features, trying next..."
          done

          if [[ -z "${BASE_URL}" ]]; then
            echo "::warning ::No MAT REST endpoint reachable — addresses will be empty."
            echo "mat_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=0
          TOTAL=0
          FIRST=true

          while true; do
            API_URL="${BASE_URL}?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultOffset=${OFFSET}&resultRecordCount=${BATCH}"
            echo "Fetching MAT batch: offset=${OFFSET} ..."

            if ! curl -fL --retry 2 --retry-delay 3 --max-time 60 \
              -o data/mat_batch.json "${API_URL}"; then
              echo "::warning ::MAT REST API request failed at offset ${OFFSET}."
              break
            fi

            # Log response size for debugging
            echo "Response size: $(wc -c < data/mat_batch.json) bytes"

            # Check how many features we got
            FEAT_COUNT=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('data/mat_batch.json'))
              if 'error' in d:
                  print('API error: ' + json.dumps(d['error']), file=sys.stderr)
              print(len(d.get('features', [])))
          except Exception as e:
              print('Parse error: ' + str(e), file=sys.stderr)
              print(0)
          ")

            if (( FEAT_COUNT == 0 )); then
              echo "No more features at offset ${OFFSET}. Done."
              break
            fi

            ogr2ogr -f GPKG data/sales.gpkg data/mat_batch.json \
              -t_srs EPSG:4326 -nln mat -append

            TOTAL=$((TOTAL + FEAT_COUNT))
            OFFSET=$((OFFSET + BATCH))

            # Check if server indicated more results
            EXCEEDED=$(python3 -c "
          import json
          d = json.load(open('data/mat_batch.json'))
          print('true' if d.get('exceededTransferLimit', False) else 'false')
          ")
            if [[ "${EXCEEDED}" != "true" ]]; then
              echo "Server indicates no more pages. Done."
              break
            fi
          done

          echo "Total MAT records loaded via REST API: ${TOTAL}"

          if (( TOTAL > 0 )); then
            echo "mat_available=true" >> "$GITHUB_OUTPUT"
            echo "=== MAT layer schema ==="
            ogrinfo -ro -so -al data/sales.gpkg mat
          else
            echo "::warning ::Could not load MAT from ZIP or REST API — addresses will be empty."
            echo "mat_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Discover actual MAT field names for address, city, zip
          MAT_FIELDS=$(sqlite3 data/sales.gpkg "PRAGMA table_info(mat);" | cut -d'|' -f2 | tr '\n' ',' )
          echo "MAT fields: ${MAT_FIELDS}"

          MAT_ADDR=$(sqlite3 data/sales.gpkg "
            SELECT name FROM pragma_table_info('mat')
            WHERE lower(name) IN ('full_addre','full_address','address','siteaddres','siteaddress','site_addr','site_address','propaddr','street_add','location_a','txt_addres')
            LIMIT 1
          ")
          echo "mat_addr_field=${MAT_ADDR:-(none)}"
          echo "mat_addr_field=${MAT_ADDR}" >> "$GITHUB_OUTPUT"

          MAT_CITY=$(sqlite3 data/sales.gpkg "
            SELECT name FROM pragma_table_info('mat')
            WHERE lower(name) IN ('nme_city','nme_po_cit','city','city_name','site_city','citydesc','municipali')
            LIMIT 1
          ")
          echo "mat_city_field=${MAT_CITY:-(none)}"
          echo "mat_city_field=${MAT_CITY}" >> "$GITHUB_OUTPUT"

          MAT_ZIP=$(sqlite3 data/sales.gpkg "
            SELECT name FROM pragma_table_info('mat')
            WHERE lower(name) IN ('cde_zip1','zipcode','zip','zip_code','site_zip','postalcode','postal_cod')
            LIMIT 1
          ")
          echo "mat_zip_field=${MAT_ZIP:-(none)}"
          echo "mat_zip_field=${MAT_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Build CSV
        run: |
          set -euo pipefail

          STRATEGY="${{ steps.detect_fields.outputs.strategy }}"
          MAT_OK="${{ steps.mat_download.outputs.mat_available }}"
          ADDR_FIELD="${{ steps.detect_fields.outputs.addr_field }}"
          CITY_FIELD="${{ steps.detect_fields.outputs.city_field }}"
          ZIP_FIELD="${{ steps.detect_fields.outputs.zip_field }}"

          # --- Pre-flight diagnostics ---
          echo "=== GDAL version ==="
          ogr2ogr --version
          echo "=== Sales table columns ==="
          sqlite3 data/sales.gpkg "PRAGMA table_info(sales);" | cut -d'|' -f2
          SALES_COUNT=$(sqlite3 data/sales.gpkg "SELECT COUNT(*) FROM sales;")
          echo "Sales row count: ${SALES_COUNT}"
          echo "=== Sample saledate values ==="
          sqlite3 data/sales.gpkg "SELECT saledate, typeof(saledate) FROM sales WHERE saledate IS NOT NULL LIMIT 5;"
          echo "=== Date range and filter diagnostics ==="
          sqlite3 data/sales.gpkg "
            SELECT 'max_saledate' AS metric, MAX(substr(saledate,1,10)) AS value FROM sales
            UNION ALL SELECT 'min_saledate', MIN(substr(saledate,1,10)) FROM sales
            UNION ALL SELECT 'date_threshold_now', date('now','-12 months')
            UNION ALL SELECT 'rows_date_match_now', CAST(COUNT(*) AS TEXT) FROM sales WHERE substr(saledate,1,10) >= date('now','-12 months')
            UNION ALL SELECT 'rows_price_gt_0', CAST(COUNT(*) AS TEXT) FROM sales WHERE saleprice IS NOT NULL AND saleprice > 0
            UNION ALL SELECT 'rows_both_filters_now', CAST(COUNT(*) AS TEXT) FROM sales WHERE substr(saledate,1,10) >= date('now','-12 months') AND saleprice IS NOT NULL AND saleprice > 0;
          "
          echo "=== Sample recent saleprice values ==="
          sqlite3 data/sales.gpkg "SELECT substr(saledate,1,10) AS dt, saleprice, typeof(saleprice) FROM sales ORDER BY substr(saledate,1,10) DESC LIMIT 5;"
          if (( SALES_COUNT == 0 )); then
            echo "::error ::Sales table is empty."
            exit 1
          fi
          MISSING=""
          for COL in saledate saleprice parcelid propertyid; do
            EXISTS=$(sqlite3 data/sales.gpkg "SELECT COUNT(*) FROM pragma_table_info('sales') WHERE lower(name)=lower('${COL}');")
            if (( EXISTS == 0 )); then MISSING="${MISSING} ${COL}"; fi
          done
          if [[ -n "${MISSING}" ]]; then
            echo "::error ::Sales table missing required columns:${MISSING}"
            echo "Available columns:"
            sqlite3 data/sales.gpkg "PRAGMA table_info(sales);"
            exit 1
          fi
          echo "=== Strategy: ${STRATEGY}, MAT available: ${MAT_OK} ==="

          # Compute date cutoff: last 12 months of available data (not from today)
          MAX_SALE_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(substr(saledate,1,10)) FROM sales WHERE saleprice IS NOT NULL AND saleprice > 0;")
          if [[ -z "${MAX_SALE_DATE}" || "${MAX_SALE_DATE}" == "NULL" ]]; then
            echo "::error ::No valid sales found in dataset."
            exit 1
          fi
          DATE_CUTOFF=$(sqlite3 data/sales.gpkg "SELECT date('${MAX_SALE_DATE}', '-12 months');")
          echo "Most recent sale: ${MAX_SALE_DATE}, cutoff (12 months prior): ${DATE_CUTOFF}"

          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" || true

          if [[ "${STRATEGY}" == "sales_direct" ]]; then
            echo "Using address fields directly from Parcel_Sales layer."
            if [[ -n "${ADDR_FIELD}" ]]; then ADDR_EXPR="COALESCE(s.${ADDR_FIELD}, '')"; else ADDR_EXPR="''"; fi
            if [[ -n "${CITY_FIELD}" ]]; then CITY_EXPR="COALESCE(s.${CITY_FIELD}, '')"; else CITY_EXPR="''"; fi
            if [[ -n "${ZIP_FIELD}" ]]; then ZIP_EXPR="COALESCE(s.${ZIP_FIELD}, '')"; else ZIP_EXPR="''"; fi

            cat > data/query.sql <<SQL
            WITH recent AS (
              SELECT
                s.geom, s.parcelid, s.propertyid AS pid,
                s.saleprice, s.saledate,
                ${ADDR_EXPR} AS address,
                ${CITY_EXPR} AS city,
                ${ZIP_EXPR}  AS zipcode
              FROM sales s
              WHERE substr(s.saledate, 1, 10) >= '${DATE_CUTOFF}'
                AND s.saleprice IS NOT NULL AND s.saleprice > 0
            ),
            latest AS (
              SELECT *, ROW_NUMBER() OVER (
                PARTITION BY parcelid ORDER BY substr(saledate, 1, 10) DESC
              ) AS rn
              FROM recent
            )
            SELECT
              CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
              CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
              pid, parcelid, address, city, zipcode,
              substr(saledate, 1, 10) AS saledate,
              saleprice
            FROM latest WHERE rn = 1
            ORDER BY substr(saledate, 1, 10) DESC;
          SQL

          elif [[ "${STRATEGY}" == "needs_mat" && "${MAT_OK}" == "true" ]]; then
            echo "Using MAT spatial join for address data."
            ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('mat','geom')" || true

            MAT_ADDR_FIELD="${{ steps.mat_download.outputs.mat_addr_field }}"
            MAT_CITY_FIELD="${{ steps.mat_download.outputs.mat_city_field }}"
            MAT_ZIP_FIELD="${{ steps.mat_download.outputs.mat_zip_field }}"

            # Build COALESCE expressions based on discovered fields
            if [[ -n "${MAT_ADDR_FIELD}" ]]; then
              ADDR_SQL="COALESCE(m.${MAT_ADDR_FIELD}, '')"
            else
              ADDR_SQL="''"
            fi
            if [[ -n "${MAT_CITY_FIELD}" ]]; then
              CITY_SQL="COALESCE(m.${MAT_CITY_FIELD}, '')"
            else
              CITY_SQL="''"
            fi
            if [[ -n "${MAT_ZIP_FIELD}" ]]; then
              ZIP_SQL="COALESCE(m.${MAT_ZIP_FIELD}, '')"
            else
              ZIP_SQL="''"
            fi

            echo "Address SQL: ${ADDR_SQL}"
            echo "City SQL: ${CITY_SQL}"
            echo "Zip SQL: ${ZIP_SQL}"

            cat > data/query.sql <<SQL
            WITH recent AS (
              SELECT
                s.geom, s.parcelid, s.propertyid AS pid,
                s.saleprice, s.saledate
              FROM sales s
              WHERE substr(s.saledate, 1, 10) >= '${DATE_CUTOFF}'
                AND s.saleprice IS NOT NULL AND s.saleprice > 0
            ),
            latest AS (
              SELECT geom, parcelid, pid, saleprice, saledate,
                ROW_NUMBER() OVER (
                  PARTITION BY parcelid ORDER BY substr(saledate, 1, 10) DESC
                ) AS rn
              FROM recent
            ),
            base AS (
              SELECT * FROM latest WHERE rn = 1
            ),
            mat_join AS (
              SELECT
                b.parcelid,
                ${ADDR_SQL} AS address,
                ${CITY_SQL} AS city,
                ${ZIP_SQL}  AS zipcode,
                ROW_NUMBER() OVER (
                  PARTITION BY b.parcelid
                  ORDER BY (${ADDR_SQL} != '') DESC
                ) AS addr_rank
              FROM base b
              LEFT JOIN mat m ON ST_Intersects(m.geom, b.geom)
            )
            SELECT
              CAST(ST_X(ST_Centroid(b.geom)) AS REAL) AS lon,
              CAST(ST_Y(ST_Centroid(b.geom)) AS REAL) AS lat,
              b.pid, b.parcelid,
              COALESCE(j.address, '')  AS address,
              COALESCE(j.city, '')     AS city,
              COALESCE(j.zipcode, '')  AS zipcode,
              substr(b.saledate, 1, 10) AS saledate,
              b.saleprice
            FROM base b
            LEFT JOIN mat_join j
              ON b.parcelid = j.parcelid AND j.addr_rank = 1
            ORDER BY substr(b.saledate, 1, 10) DESC;
          SQL

          else
            echo "::warning ::No address source available — address/city/zipcode will be empty."
            cat > data/query.sql <<SQL
            WITH recent AS (
              SELECT
                s.geom, s.parcelid, s.propertyid AS pid,
                s.saleprice, s.saledate
              FROM sales s
              WHERE substr(s.saledate, 1, 10) >= '${DATE_CUTOFF}'
                AND s.saleprice IS NOT NULL AND s.saleprice > 0
            ),
            latest AS (
              SELECT *, ROW_NUMBER() OVER (
                PARTITION BY parcelid ORDER BY substr(saledate, 1, 10) DESC
              ) AS rn
              FROM recent
            )
            SELECT
              CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
              CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
              pid, parcelid,
              '' AS address, '' AS city, '' AS zipcode,
              substr(saledate, 1, 10) AS saledate,
              saleprice
            FROM latest WHERE rn = 1
            ORDER BY substr(saledate, 1, 10) DESC;
          SQL
          fi

          echo "=== Query ==="
          cat data/query.sql
          echo ""

          OGR_EXIT=0
          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)" || OGR_EXIT=$?

          echo "ogr2ogr exit code: ${OGR_EXIT}"

          if [[ ! -f public/parcel_sales.csv ]]; then
            echo "::error ::ogr2ogr did not create public/parcel_sales.csv (exit code: ${OGR_EXIT})"
            echo "=== Query that was attempted ==="
            cat data/query.sql
            echo ""
            echo "=== Diagnostic: filtered row count ==="
            sqlite3 data/sales.gpkg "SELECT COUNT(*) AS cnt FROM sales WHERE substr(saledate, 1, 10) >= '${DATE_CUTOFF}' AND saleprice IS NOT NULL AND saleprice > 0;" || true
            exit 1
          fi

          echo "Output file created: $(wc -l < public/parcel_sales.csv) lines"

      - name: Validate output
        run: |
          set -euo pipefail
          if [[ ! -f public/parcel_sales.csv ]]; then
            echo "::error ::public/parcel_sales.csv does not exist — Build CSV step failed to produce output."
            exit 1
          fi
          ROW_COUNT=$(wc -l < public/parcel_sales.csv)
          echo "Output rows (including header): ${ROW_COUNT}"
          if (( ROW_COUNT < 2 )); then
            echo "::error ::Output CSV is empty — something went wrong with the query."
            exit 1
          fi
          ADDR_FILLED=$(awk -F',' 'NR>1 && $5!="" {count++} END {print count+0}' public/parcel_sales.csv)
          TOTAL=$((ROW_COUNT - 1))
          echo "Rows with address data: ${ADDR_FILLED}/${TOTAL}"
          if (( ADDR_FILLED == 0 )); then
            echo "::warning ::No address data in output — all address fields are empty."
          fi
          echo ""
          echo "Sample output:"
          head -5 public/parcel_sales.csv

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
