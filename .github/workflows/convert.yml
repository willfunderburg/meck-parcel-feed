name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # 01:00 ET summer / 00:00 ET winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download and unzip Parcel_Sales
        run: |
          set -euo pipefail
          mkdir -p data/shp public

          TS="$(date +%s)"
          SALES_URLS=(
            "https://maps.mecknc.gov/opendata/Parcel_Sales.zip?nocache=${TS}"
            "https://maps.mecklenburgcountync.gov/opendata/Parcel_Sales.zip?nocache=${TS}"
          )

          FOUND_URL=""
          for URL in "${SALES_URLS[@]}"; do
            echo "Trying Parcel_Sales download: ${URL}"
            if curl -fL --retry 3 --retry-delay 5 \
              -H "Cache-Control: no-cache" \
              -o data/Parcel_Sales.zip \
              "${URL}"; then
              FOUND_URL="${URL}"
              break
            fi
          done

          if [[ -z "${FOUND_URL}" ]]; then
            echo "::error ::Parcel_Sales.zip could not be downloaded from any known URL."
            printf ' - %s\n' "${SALES_URLS[@]}"
            exit 1
          fi

          echo "Downloaded Parcel_Sales from: ${FOUND_URL}"
          unzip -o data/Parcel_Sales.zip -d data/shp

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          echo "Using shapefile: ${SHP_FILE}"
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Check source staleness (warn-only)
        run: |
          set -euo pipefail
          MAX_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(date(saledate)) FROM sales;")
          if [[ -z "${MAX_DATE:-}" || "${MAX_DATE}" == "NULL" ]]; then
            echo "::warning ::Couldn't determine MAX(saledate) from source."
          else
            NOW_UTC=$(date -u +%s)
            MAX_EPOCH=$(date -u -d "$MAX_DATE" +%s)
            AGE_DAYS=$(( (NOW_UTC - MAX_EPOCH) / 86400 ))
            echo "MAX(saledate)=${MAX_DATE}  age=${AGE_DAYS}d"
            if (( AGE_DAYS > 3 )); then
              echo "::warning ::Source dataset appears stale (MAX(saledate)=${MAX_DATE}, ${AGE_DAYS} days old). Proceeding anyway."
            fi
          fi

      - name: Build latest-per-parcel (last 12 months) CSV
        run: |
          set -euo pipefail

          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" || echo "sales spatial index already exists"

          cat > data/query.sql <<'SQL'
          -- 1) Filter to last 12 months AND positive sale price
          WITH recent AS (
            SELECT
              s.geom,
              s.parcelid,
              s.propertyid AS pid,
              s.saleprice,
              s.saledate
            FROM sales s
            WHERE date(s.saledate) >= date('now','-12 months')
              AND s.saleprice IS NOT NULL
              AND s.saleprice > 0
          ),

          -- 2) Keep latest sale per parcel
          latest AS (
            SELECT
              geom,
              parcelid,
              pid,
              saleprice,
              saledate,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate) DESC
              ) AS rn
            FROM recent
          )

          -- 3) Final projection
          SELECT
            CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
            CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
            pid,
            parcelid,
            '' AS address,
            '' AS city,
            '' AS zipcode,
            strftime('%Y-%m-%d', saledate) AS saledate,
            saleprice
          FROM latest
          WHERE rn = 1
          ORDER BY date(saledate) DESC;
          SQL

          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
