name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # 01:00 ET summer / 00:00 ET winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download and unzip Parcel_Sales (cache-busted)
        run: |
          set -euo pipefail
          mkdir -p data/shp public
          TS="$(date +%s)"
          echo "Downloading Parcel_Sales.zip (ts=${TS})..."
          curl -fL --retry 5 --retry-delay 5 \
            -H "Cache-Control: no-cache" \
            -o data/Parcel_Sales.zip \
            "https://maps.mecknc.gov/opendata/Parcel_Sales.zip?nocache=${TS}"
          unzip -o data/Parcel_Sales.zip -d data/shp
          ls -l data/shp | sed 's/^/  /'

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          echo "Using shapefile: $SHP_FILE"
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Download and load MAT (Master Address Table) as 'mat'
        run: |
          set -euo pipefail
          mkdir -p data/mat
          TS="$(date +%s)"
          echo "Downloading MAT.zip (ts=${TS})..."
          curl -fL --retry 5 --retry-delay 5 \
            -H "Cache-Control: no-cache" \
            -o data/MAT.zip \
            "https://maps.mecknc.gov/opendata/MAT.zip?nocache=${TS}"
          unzip -o data/MAT.zip -d data/mat
          MAT_SHP=$(ls data/mat/*.shp | head -n 1)
          echo "Using MAT shapefile: $MAT_SHP"
          ogr2ogr -f GPKG data/sales.gpkg "$MAT_SHP" -t_srs EPSG:4326 -nln mat -overwrite

      - name: Quick sanity checks (date coverage)
        run: |
          set -euo pipefail
          echo "== MIN/MAX sale date =="
          ogrinfo -q data/sales.gpkg -sql "SELECT MIN(saledate) AS min_date, MAX(saledate) AS max_date, COUNT(*) AS n FROM sales"

          echo "== Top 10 most recent dates in file =="
          ogrinfo -q data/sales.gpkg -sql "SELECT saledate, COUNT(*) AS n FROM sales GROUP BY saledate ORDER BY date(saledate) DESC LIMIT 10"

          # Fail fast if the latest date looks stale (> 3 days behind today)
          MAX_DATE=$(ogrinfo -ro -q data/sales.gpkg -sql "SELECT MAX(saledate) FROM sales" | awk -F= '/MAX/ {gsub(/[[:space:]]*/,"",$2); print $2}')
          echo "Detected MAX(saledate) = ${MAX_DATE}"
          if [[ -n "${MAX_DATE}" ]]; then
            # Convert both to epoch seconds (treat saledate as UTC)
            NOW_EPOCH=$(date -u +%s)
            MAX_EPOCH=$(date -u -d "${MAX_DATE}" +%s || echo "")
            if [[ -n "${MAX_EPOCH}" ]]; then
              AGE_DAYS=$(( (NOW_EPOCH - MAX_EPOCH) / 86400 ))
              echo "Latest sale age: ${AGE_DAYS} day(s)"
              if (( AGE_DAYS > 3 )); then
                echo "::error ::Source dataset appears stale (MAX(saledate)=${MAX_DATE}, ${AGE_DAYS} days old)."
                echo "        This usually means the ZIP response was cached upstream."
                echo "        Re-run later, or check the county portal for the latest date."
                exit 1
              fi
            fi
          fi

      - name: Inspect MAT fields (for troubleshooting)
        run: |
          ogrinfo -ro -so -al data/sales.gpkg mat

      - name: Build latest-per-parcel (last 12 months) CSV with address (spatial join)
        run: |
          set -euo pipefail

          # Spatial indexes (ignore if already exist)
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" || echo "sales spatial index already exists"
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('mat','geom')"   || echo "mat spatial index already exists"

          cat > data/query.sql <<'SQL'
          -- 1) Filter to last 12 months AND positive sale price
          WITH recent AS (
            SELECT
              s.geom,
              s.parcelid,
              s.propertyid AS pid,
              s.saleprice,
              s.saledate
            FROM sales s
            WHERE date(s.saledate) >= date('now','-12 months')
              AND s.saleprice IS NOT NULL
              AND s.saleprice > 0
          ),
          -- 2) Keep the latest sale per parcel
          latest AS (
            SELECT
              geom, parcelid, pid, saleprice, saledate,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate) DESC
              ) AS rn
            FROM recent
          ),
          base AS (
            SELECT * FROM latest WHERE rn = 1
          ),
          -- 3) Spatial join to MAT points (address data)
          mat_join AS (
            SELECT
              b.parcelid,
              COALESCE(m.full_addre, m.address, '')   AS address,
              COALESCE(m.nme_city,  m.nme_po_cit, '') AS city,
              COALESCE(m.cde_zip1, '')                AS zipcode,
              ROW_NUMBER() OVER (
                PARTITION BY b.parcelid
                ORDER BY (m.full_addre IS NOT NULL) DESC,
                         (m.address   IS NOT NULL) DESC
              ) AS addr_rank
            FROM base b
            LEFT JOIN mat m
              ON ST_Intersects(m.geom, b.geom)
          )
          -- 4) Final projection
          SELECT
            CAST(ST_X(ST_Centroid(b.geom)) AS REAL) AS lon,
            CAST(ST_Y(ST_Centroid(b.geom)) AS REAL) AS lat,
            b.pid,
            b.parcelid,
            COALESCE(j.address, '')  AS address,
            COALESCE(j.city, '')     AS city,
            COALESCE(j.zipcode, '')  AS zipcode,
            strftime('%Y-%m-%d', b.saledate) AS saledate,
            b.saleprice
          FROM base b
          LEFT JOIN mat_join j
            ON b.parcelid = j.parcelid
           AND j.addr_rank = 1
          ORDER BY date(b.saledate) DESC;
          SQL

          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

          echo "== Preview of newest 10 rows in output =="
          head -n 11 public/parcel_sales.csv

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
