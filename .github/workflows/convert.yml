name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # 01:00 ET summer / 00:00 ET winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download and unzip Parcel_Sales
        run: |
          set -euo pipefail
          mkdir -p data/shp public
          curl -fL -o data/Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"
          unzip -o data/Parcel_Sales.zip -d data/shp

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Download and load MAT (Master Address Table) as 'mat'
        run: |
          set -euo pipefail
          mkdir -p data/mat
          curl -fL -o data/MAT.zip "https://maps.mecknc.gov/opendata/MAT.zip"
          unzip -o data/MAT.zip -d data/mat
          MAT_SHP=$(ls data/mat/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$MAT_SHP" -t_srs EPSG:4326 -nln mat -overwrite

      - name: Inspect MAT fields (for troubleshooting)
        run: |
          ogrinfo -ro -so -al data/sales.gpkg mat

      - name: Sanity report (source snapshot)
        run: |
          set -euo pipefail
          echo "---- sales table quick stats ----"
          ogrinfo data/sales.gpkg -sql "SELECT COUNT(*) AS total_rows FROM sales"
          ogrinfo data/sales.gpkg -sql "SELECT MIN(saledate) AS min_date, MAX(saledate) AS max_date FROM sales"

          echo "---- last 14 days, with and without price>0 ----"
          ogrinfo data/sales.gpkg -sql "SELECT COUNT(*) AS last14_all FROM sales WHERE date(saledate) >= date('now','-14 days')"
          ogrinfo data/sales.gpkg -sql "SELECT COUNT(*) AS last14_pos FROM sales WHERE date(saledate) >= date('now','-14 days') AND saleprice > 0"

          echo "---- last 7 days by price bucket (0 vs >0) ----"
          ogrinfo data/sales.gpkg -sql "SELECT SUM(CASE WHEN saleprice=0 THEN 1 ELSE 0 END) AS zero_price, SUM(CASE WHEN saleprice>0 THEN 1 ELSE 0 END) AS positive FROM sales WHERE date(saledate) >= date('now','-7 days')"

          echo "---- sample zero-price (if any) ----"
          ogrinfo data/sales.gpkg -sql "SELECT parcelid, propertyid, saledate, saleprice FROM sales WHERE date(saledate) >= date('now','-14 days') AND (saleprice IS NULL OR saleprice=0) LIMIT 10"

      - name: Build latest-per-parcel (last 12 months) CSV with address (keep zero-price, flag them)
        run: |
          set -euo pipefail
          # Create spatial indexes if missing; ignore "already exists" errors
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" || echo "sales spatial index already exists"
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('mat','geom')"   || echo "mat spatial index already exists"

          cat > data/query.sql <<'SQL'
          -- 1) Filter to last 12 months (keep all; flag zero-price)
          WITH recent AS (
            SELECT
              s.geom,
              s.parcelid,
              s.propertyid AS pid,
              s.saleprice,
              s.saledate,
              CASE WHEN s.saleprice IS NULL OR s.saleprice = 0 THEN 1 ELSE 0 END AS is_zero_price
            FROM sales s
            WHERE date(s.saledate) >= date('now','-12 months')
          ),

          -- 2) Keep the latest sale per parcel
          latest AS (
            SELECT
              geom, parcelid, pid, saleprice, saledate, is_zero_price,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate) DESC
              ) AS rn
            FROM recent
          ),

          base AS (
            SELECT * FROM latest WHERE rn = 1
          ),

          -- 3) Spatial join to MAT points (address data)
          mat_join AS (
            SELECT
              b.parcelid,
              COALESCE(m.full_addre, m.address, '')   AS address,
              COALESCE(m.nme_city,  m.nme_po_cit, '') AS city,
              COALESCE(m.cde_zip1, '')                AS zipcode,
              ROW_NUMBER() OVER (
                PARTITION BY b.parcelid
                ORDER BY (m.full_addre IS NOT NULL) DESC,
                         (m.address   IS NOT NULL) DESC
              ) AS addr_rank
            FROM base b
            LEFT JOIN mat m
              ON ST_Intersects(m.geom, b.geom)
          )

          -- 4) Final projection
          SELECT
            CAST(ST_X(ST_Centroid(b.geom)) AS REAL) AS lon,
            CAST(ST_Y(ST_Centroid(b.geom)) AS REAL) AS lat,
            b.pid,
            b.parcelid,
            COALESCE(j.address, '')  AS address,
            COALESCE(j.city, '')     AS city,
            COALESCE(j.zipcode, '')  AS zipcode,
            strftime('%Y-%m-%d', b.saledate) AS saledate,
            b.saleprice,
            b.is_zero_price
          FROM base b
          LEFT JOIN mat_join j
            ON b.parcelid = j.parcelid
           AND j.addr_rank = 1
          ORDER BY date(b.saledate) DESC, b.is_zero_price ASC;
          SQL

          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

      - name: Show diff stat (if any)
        run: |
          git status --porcelain public/parcel_sales.csv || true
          git diff --numstat public/parcel_sales.csv || true

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
