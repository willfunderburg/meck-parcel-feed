name: Convert Meck Parcel Sales to CSV (WGS84)

on:
  schedule:
    - cron: "15 10 * * 1"   # every Monday 10:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GDAL
        run: |
          set -e
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin unzip curl jq

      - name: Download shapefile zip
        run: |
          set -e
          mkdir -p data
          cd data
          curl -fL -o Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"

      - name: Unzip shapefile
        run: |
          set -e
          cd data
          unzip -o Parcel_Sales.zip

      - name: Detect layer name
        id: layer
        run: |
          set -e
          cd data
          LAYER=$(ls *.shp | head -n1 | sed 's/\.shp$//')
          echo "Layer detected: $LAYER"
          echo "layer=$LAYER" >> $GITHUB_OUTPUT

      - name: Reproject to WGS84 GeoJSON (temporary)
        run: |
          set -ex
          cd data
          SHP="${{ steps.layer.outputs.layer }}.shp"
          ogr2ogr -f GeoJSON -s_srs EPSG:2264 -t_srs EPSG:4326 parcel_sales.geojson "$SHP"
          ogrinfo -ro -so -al -json parcel_sales.geojson > meta.json
          head -c 400 meta.json || true
          echo

      - name: Export minimal CSV with lon/lat (no SQL; robust + non-failing finder)
        run: |
          set -ex
          cd data

          # Parse layer + fields from meta.json
          LAYER=$(jq -r '.layers[0].name // empty' meta.json)
          if [ -z "$LAYER" ]; then
            LAYER="${{ steps.layer.outputs.layer }}"
          fi
          echo "Using layer: $LAYER"

          jq -r '.layers[0].fields[]?.name' meta.json > fields.txt || true
          echo "Fields detected:"; cat fields.txt || true

          # Non-failing finder: echoes match or empty, ALWAYS returns 0
          find_field () {
            awk '{print tolower($0)":"$0}' fields.txt 2>/dev/null > fields_map.txt || true
            for want in "$@"; do
              lwant=$(printf "%s" "$want" | tr '[:upper:]' '[:lower:]')
              match=$(awk -F: -v t="$lwant" '$1==t {print $2; exit}' fields_map.txt 2>/dev/null || true)
              if [ -n "$match" ]; then
                echo "$match"
                echo "" > /dev/null  # keep exit 0
                return 0
              fi
            done
            echo ""   # no match; still exit 0 so set -e doesn't kill us
            return 0
          }

          PID=$(find_field pid parcelid taxpid commonpid id_Common_Pid)
          PARCELID=$(find_field parcelid propertyid)
          STNUM=$(find_field streetnumber stnumber housenum housenumber)
          STNAME=$(find_field streetname stname address addr)
          CITY=$(find_field city loccity)
          ZIP=$(find_field zipcode zip)
          DATEF=$(find_field saledate dte_DateofSale dte_dateofsale dateofsale)
          PRICEF=$(find_field saleprice amt_Price price)

          # Build a -select list only with fields that exist (no geometry here)
          SEL=""
          [ -n "$PID" ]      && SEL="${SEL:+$SEL,}$PID"
          [ -n "$PARCELID" ] && SEL="${SEL:+$SEL,}$PARCELID"
          [ -n "$STNUM" ]    && SEL="${SEL:+$SEL,}$STNUM"
          [ -n "$STNAME" ]   && SEL="${SEL:+$SEL,}$STNAME"
          [ -n "$CITY" ]     && SEL="${SEL:+$SEL,}$CITY"
          [ -n "$ZIP" ]      && SEL="${SEL:+$SEL,}$ZIP"
          [ -n "$DATEF" ]    && SEL="${SEL:+$SEL,}$DATEF"
          [ -n "$PRICEF" ]   && SEL="${SEL:+$SEL,}$PRICEF"
          echo "Select list: ${SEL:-<none>}"

          if [ -n "$SEL" ]; then
            ogr2ogr -f CSV parcel_sales_raw.csv parcel_sales.geojson \
              -nln "$LAYER" \
              -lco GEOMETRY=AS_XY \
              -select "$SEL"
          else
            # no attributes matched; still export with just X,Y
            ogr2ogr -f CSV parcel_sales_raw.csv parcel_sales.geojson \
              -nln "$LAYER" \
              -lco GEOMETRY=AS_XY
          fi

          # Rename header X,Y to lon,lat for downstream consistency
          read -r HEADER < parcel_sales_raw.csv
          echo "Raw header: $HEADER"
          printf '%s\n' "$HEADER" | awk 'NR==1{gsub(/^X,Y,/, "lon,lat,"); gsub(/^X,Y$/, "lon,lat"); print}' > header.tmp
          NEWHEADER=$(cat header.tmp)
          tail -n +2 parcel_sales_raw.csv > body.tmp
          printf '%s\n' "$NEWHEADER" > parcel_sales.csv
          cat body.tmp >> parcel_sales.csv
          rm -f header.tmp body.tmp parcel_sales_raw.csv

          echo "CSV preview:"
          head -n 5 parcel_sales.csv || true
          wc -l parcel_sales.csv || true

      - name: Prepare public folder (CSV only)
        run: |
          set -e
          mkdir -p public
          mv data/parcel_sales.csv public/parcel_sales.csv

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/parcel_sales.csv
          git commit -m "Auto-update parcel sales CSV (lon/lat, attrs) [skip ci]" || echo "No changes to commit"
          git push
