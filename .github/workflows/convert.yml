name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "15 10 * * 1"   # Mondays 10:15 UTC
  workflow_dispatch:

permissions:
  contents: write  # allow GITHUB_TOKEN to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download and unzip Parcel_Sales
        run: |
          set -euo pipefail
          mkdir -p data/shp public
          curl -fL -o data/Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"
          unzip -o data/Parcel_Sales.zip -d data/shp

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Download and load MAT (Master Address Table) as 'mat'
        run: |
          set -euo pipefail
          mkdir -p data/mat
          curl -fL -o data/MAT.zip "https://maps.mecknc.gov/opendata/MAT.zip"
          unzip -o data/MAT.zip -d data/mat
          MAT_SHP=$(ls data/mat/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$MAT_SHP" -t_srs EPSG:4326 -nln mat -overwrite

      - name: Inspect MAT fields (for troubleshooting)
        run: |
          ogrinfo -ro -so -al data/sales.gpkg mat

      - name: Build latest-per-parcel (last 12 months) CSV with address
        run: |
          set -euo pipefail
          # NOTE: If MAT field names differ, edit the three column names below:
          #   address -> siteaddre
          #   city    -> city
          #   zipcode -> zipcode
          cat > data/query.sql <<'SQL'
          WITH recent AS (
            SELECT
              s.geom,
              s.parcelid,
              s.propertyid AS pid,
              s.saleprice,
              s.saledate
            FROM sales s
            WHERE date(s.saledate) >= date('now','-12 months')
          ),
          joined AS (
            SELECT
              r.*,
              COALESCE(m.siteaddre, '') AS address,
              COALESCE(m.city, '')      AS city,
              COALESCE(m.zipcode, '')   AS zipcode
            FROM recent r
            LEFT JOIN mat m
              ON r.parcelid = m.parcelid
          ),
          ranked AS (
            SELECT
              CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
              CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
              pid,
              parcelid,
              address,
              city,
              zipcode,
              strftime('%Y-%m-%d', saledate) AS saledate,
              saleprice,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate) DESC
              ) AS rn
            FROM joined
          )
          SELECT
            lon, lat, pid, parcelid, address, city, zipcode, saledate, saleprice
          FROM ranked
          WHERE rn = 1
          ORDER BY date(saledate) DESC;
          SQL

          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
