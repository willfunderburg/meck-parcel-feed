name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # 01:00 ET summer / 00:00 ET winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 curl

      - name: Discover NC OneMap schema
        id: schema
        run: |
          set -euo pipefail
          mkdir -p data public

          BASE_URLS=(
            "https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/MapServer"
            "https://services.gis.nc.gov/secure/rest/services/NC1Map_Parcels/MapServer"
          )

          # Find a reachable server and working layer
          LAYER_URL=""
          for BASE in "${BASE_URLS[@]}"; do
            for LID in 1 0; do
              PROBE_URL="${BASE}/${LID}/query?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultRecordCount=1"
              echo "Probing: ${BASE}/${LID}"
              if curl -fsSL --max-time 20 -o data/probe.json "${PROBE_URL}" 2>/dev/null; then
                FEAT_COUNT=$(python3 -c "
          import json
          d = json.load(open('data/probe.json'))
          print(len(d.get('features', [])))" 2>/dev/null)
                if (( FEAT_COUNT > 0 )); then
                  LAYER_URL="${BASE}/${LID}/query"
                  echo "Using layer: ${BASE}/${LID}"
                  break 2
                fi
              fi
            done
          done

          if [[ -z "${LAYER_URL}" ]]; then
            echo "::error ::NC OneMap Parcels service unreachable from all known URLs."
            exit 1
          fi
          echo "layer_url=${LAYER_URL}" >> "$GITHUB_OUTPUT"

          # Discover field names from sample record
          SCHEMA=$(python3 << 'PYEOF'
          import json, sys

          d = json.load(open('data/probe.json'))
          feat = d['features'][0]
          attrs = feat.get('attributes', {})
          fields = list(attrs.keys())
          print(f"ALL_FIELDS: {', '.join(fields)}", file=sys.stderr)

          def find_field(keywords, exclude=None):
              for f in fields:
                  fl = f.lower()
                  if exclude and any(e in fl for e in exclude):
                      continue
                  if any(k in fl for k in keywords):
                      return f
              return ""

          county_field = find_field(['cntyname', 'county_nam', 'county', 'fips'])
          parcel_field = find_field(['parno', 'parcel_id', 'pid', 'pin', 'reid', 'parcelid'])
          price_field = find_field(['saleprice', 'sale_price', 'totalsaleprice', 'price', 'consideration'])
          date_field = find_field(['saledate', 'sale_date', 'datesold', 'deed_date'], exclude=['txt'])
          addr_field = find_field(['siteadd', 'site_addr', 'phyadd', 'address', 'propaddr', 'full_addre'], exclude=['city', 'zip', 'state'])
          city_field = find_field(['site_city', 'citydesc', 'city_name', 'city', 'nme_city'], exclude=['zip', 'addr', 'add'])
          zip_field = find_field(['site_zip', 'zipcode', 'zip_code', 'cde_zip', 'zip', 'postalcode'])
          altparcel_field = find_field(['altparno', 'alt_parno', 'propertyid', 'property_id'])

          # Detect date format from sample value
          sample_date = attrs.get(date_field, None) if date_field else None
          date_fmt = "unknown"
          if sample_date is not None:
              if isinstance(sample_date, (int, float)) and sample_date > 1e10:
                  date_fmt = "epoch_ms"
              elif isinstance(sample_date, (int, float)):
                  date_fmt = "epoch_s"
              elif isinstance(sample_date, str) and len(sample_date) >= 10:
                  date_fmt = "string"
              else:
                  date_fmt = "unknown"

          print(f"county_field={county_field}")
          print(f"parcel_field={parcel_field}")
          print(f"price_field={price_field}")
          print(f"date_field={date_field}")
          print(f"date_format={date_fmt}")
          print(f"addr_field={addr_field}")
          print(f"city_field={city_field}")
          print(f"zip_field={zip_field}")
          print(f"altparcel_field={altparcel_field}")
          print(f"sample_date={sample_date}")

          # Verify critical fields exist
          missing = []
          if not parcel_field: missing.append("parcel ID")
          if not price_field: missing.append("sale price")
          if not date_field: missing.append("sale date")
          if missing:
              print(f"MISSING: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)
          PYEOF
          )

          echo "=== Schema Discovery ==="
          echo "${SCHEMA}"

          # Parse outputs
          while IFS='=' read -r KEY VAL; do
            echo "${KEY}=${VAL}" >> "$GITHUB_OUTPUT"
          done <<< "${SCHEMA}"

      - name: Download Mecklenburg parcels from NC OneMap
        id: download
        run: |
          set -euo pipefail

          LAYER_URL="${{ steps.schema.outputs.layer_url }}"
          COUNTY_FIELD="${{ steps.schema.outputs.county_field }}"
          PRICE_FIELD="${{ steps.schema.outputs.price_field }}"
          PARCEL_FIELD="${{ steps.schema.outputs.parcel_field }}"
          DATE_FIELD="${{ steps.schema.outputs.date_field }}"
          ADDR_FIELD="${{ steps.schema.outputs.addr_field }}"
          CITY_FIELD="${{ steps.schema.outputs.city_field }}"
          ZIP_FIELD="${{ steps.schema.outputs.zip_field }}"
          ALTPARCEL_FIELD="${{ steps.schema.outputs.altparcel_field }}"

          # Build outFields list (only request what we need)
          OUT_FIELDS="${PARCEL_FIELD},${PRICE_FIELD},${DATE_FIELD}"
          [[ -n "${ADDR_FIELD}" ]] && OUT_FIELDS="${OUT_FIELDS},${ADDR_FIELD}"
          [[ -n "${CITY_FIELD}" ]] && OUT_FIELDS="${OUT_FIELDS},${CITY_FIELD}"
          [[ -n "${ZIP_FIELD}" ]] && OUT_FIELDS="${OUT_FIELDS},${ZIP_FIELD}"
          [[ -n "${ALTPARCEL_FIELD}" ]] && OUT_FIELDS="${OUT_FIELDS},${ALTPARCEL_FIELD}"
          [[ -n "${COUNTY_FIELD}" ]] && OUT_FIELDS="${OUT_FIELDS},${COUNTY_FIELD}"

          # Build WHERE clause
          if [[ -n "${COUNTY_FIELD}" ]]; then
            WHERE="${COUNTY_FIELD}='MECKLENBURG' AND ${PRICE_FIELD}>0"
          else
            WHERE="${PRICE_FIELD}>0"
          fi
          WHERE_ENC=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "${WHERE}")

          echo "Query: WHERE ${WHERE}"
          echo "Fields: ${OUT_FIELDS}"

          BATCH=2000
          OFFSET=0
          TOTAL=0

          while true; do
            API_URL="${LAYER_URL}?where=${WHERE_ENC}&outFields=${OUT_FIELDS}&returnGeometry=true&outSR=4326&f=json&resultOffset=${OFFSET}&resultRecordCount=${BATCH}"
            echo "Fetching batch: offset=${OFFSET} ..."
            if ! curl -fL --retry 2 --retry-delay 5 --max-time 120 \
              -o data/batch.json "${API_URL}"; then
              echo "::warning ::Request failed at offset ${OFFSET}."
              break
            fi

            FEAT_COUNT=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('data/batch.json'))
              if 'error' in d: print('API error: ' + str(d['error']), file=sys.stderr)
              print(len(d.get('features', [])))
          except: print(0)
          ")
            if (( FEAT_COUNT == 0 )); then
              echo "No more features at offset ${OFFSET}."
              break
            fi

            if (( TOTAL == 0 )); then
              ogr2ogr -f GPKG data/sales.gpkg data/batch.json \
                -t_srs EPSG:4326 -nln sales -overwrite
            else
              ogr2ogr -f GPKG data/sales.gpkg data/batch.json \
                -t_srs EPSG:4326 -nln sales -append
            fi
            TOTAL=$((TOTAL + FEAT_COUNT))
            OFFSET=$((OFFSET + BATCH))

            EXCEEDED=$(python3 -c "
          import json
          d = json.load(open('data/batch.json'))
          print('true' if d.get('exceededTransferLimit', False) else 'false')
          ")
            [[ "${EXCEEDED}" != "true" ]] && break
          done

          echo "Total records downloaded: ${TOTAL}"
          if (( TOTAL == 0 )); then
            echo "::error ::No parcels downloaded from NC OneMap."
            exit 1
          fi

      - name: Verify data and check freshness
        run: |
          set -euo pipefail

          echo "=== Sales layer schema ==="
          ogrinfo -ro -so -al data/sales.gpkg sales

          SALES_COUNT=$(sqlite3 data/sales.gpkg "SELECT COUNT(*) FROM sales;")
          echo "Total rows: ${SALES_COUNT}"

          DATE_FIELD="${{ steps.schema.outputs.date_field }}"
          DATE_FMT="${{ steps.schema.outputs.date_format }}"
          PRICE_FIELD="${{ steps.schema.outputs.price_field }}"

          echo "=== Date field diagnostics ==="
          sqlite3 data/sales.gpkg "SELECT ${DATE_FIELD}, typeof(${DATE_FIELD}) FROM sales WHERE ${DATE_FIELD} IS NOT NULL LIMIT 5;"

          if [[ "${DATE_FMT}" == "epoch_ms" ]]; then
            MAX_DATE=$(sqlite3 data/sales.gpkg "SELECT strftime('%Y-%m-%d', ${DATE_FIELD}/1000, 'unixepoch') FROM sales WHERE ${PRICE_FIELD} > 0 ORDER BY ${DATE_FIELD} DESC LIMIT 1;")
          else
            MAX_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(substr(${DATE_FIELD}, 1, 10)) FROM sales WHERE ${PRICE_FIELD} > 0;")
          fi

          echo "Most recent sale date: ${MAX_DATE}"
          if [[ -z "${MAX_DATE}" || "${MAX_DATE}" == "NULL" ]]; then
            echo "::error ::Could not determine most recent sale date."
            exit 1
          fi

          NOW_UTC=$(date -u +%s)
          MAX_EPOCH=$(date -u -d "${MAX_DATE}" +%s 2>/dev/null || echo 0)
          AGE_DAYS=$(( (NOW_UTC - MAX_EPOCH) / 86400 ))
          echo "Data age: ${AGE_DAYS} days"

          if (( AGE_DAYS > 90 )); then
            echo "::error ::Data is ${AGE_DAYS} days stale (max date: ${MAX_DATE})."
            exit 1
          elif (( AGE_DAYS > 14 )); then
            echo "::warning ::Data is ${AGE_DAYS} days old (max date: ${MAX_DATE})."
          fi

          echo "=== Price distribution ==="
          sqlite3 data/sales.gpkg "
            SELECT
              MIN(${PRICE_FIELD}) AS min_price,
              MAX(${PRICE_FIELD}) AS max_price,
              CAST(AVG(${PRICE_FIELD}) AS INTEGER) AS avg_price,
              COUNT(*) AS total
            FROM sales WHERE ${PRICE_FIELD} > 0;
          "

      - name: Build CSV
        run: |
          set -euo pipefail

          PARCEL_FIELD="${{ steps.schema.outputs.parcel_field }}"
          PRICE_FIELD="${{ steps.schema.outputs.price_field }}"
          DATE_FIELD="${{ steps.schema.outputs.date_field }}"
          DATE_FMT="${{ steps.schema.outputs.date_format }}"
          ADDR_FIELD="${{ steps.schema.outputs.addr_field }}"
          CITY_FIELD="${{ steps.schema.outputs.city_field }}"
          ZIP_FIELD="${{ steps.schema.outputs.zip_field }}"
          ALTPARCEL_FIELD="${{ steps.schema.outputs.altparcel_field }}"

          # Build date expression based on detected format
          if [[ "${DATE_FMT}" == "epoch_ms" ]]; then
            DATE_EXPR="strftime('%Y-%m-%d', ${DATE_FIELD}/1000, 'unixepoch')"
          elif [[ "${DATE_FMT}" == "epoch_s" ]]; then
            DATE_EXPR="strftime('%Y-%m-%d', ${DATE_FIELD}, 'unixepoch')"
          else
            DATE_EXPR="substr(${DATE_FIELD}, 1, 10)"
          fi

          # Build address expressions
          if [[ -n "${ADDR_FIELD}" ]]; then ADDR_EXPR="COALESCE(${ADDR_FIELD}, '')"; else ADDR_EXPR="''"; fi
          if [[ -n "${CITY_FIELD}" ]]; then CITY_EXPR="COALESCE(${CITY_FIELD}, '')"; else CITY_EXPR="''"; fi
          if [[ -n "${ZIP_FIELD}" ]]; then ZIP_EXPR="COALESCE(${ZIP_FIELD}, '')"; else ZIP_EXPR="''"; fi

          # Use altparcel for pid if available, otherwise same as parcelid
          if [[ -n "${ALTPARCEL_FIELD}" ]]; then
            PID_EXPR="${ALTPARCEL_FIELD}"
          else
            PID_EXPR="${PARCEL_FIELD}"
          fi

          # Compute adaptive date cutoff (last 12 months of available data)
          if [[ "${DATE_FMT}" == "epoch_ms" ]]; then
            MAX_SALE_DATE=$(sqlite3 data/sales.gpkg "SELECT strftime('%Y-%m-%d', MAX(${DATE_FIELD})/1000, 'unixepoch') FROM sales WHERE ${PRICE_FIELD} > 0;")
          else
            MAX_SALE_DATE=$(sqlite3 data/sales.gpkg "SELECT MAX(substr(${DATE_FIELD}, 1, 10)) FROM sales WHERE ${PRICE_FIELD} > 0;")
          fi
          DATE_CUTOFF=$(sqlite3 data/sales.gpkg "SELECT date('${MAX_SALE_DATE}', '-12 months');")
          echo "Most recent sale: ${MAX_SALE_DATE}, cutoff: ${DATE_CUTOFF}"

          # Build spatial index
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" 2>/dev/null || true

          cat > data/query.sql <<SQL
          WITH recent AS (
            SELECT
              geom,
              ${PARCEL_FIELD} AS parcelid,
              ${PID_EXPR} AS pid,
              ${PRICE_FIELD} AS saleprice,
              ${DATE_EXPR} AS saledate,
              ${ADDR_EXPR} AS address,
              ${CITY_EXPR} AS city,
              ${ZIP_EXPR} AS zipcode
            FROM sales
            WHERE ${PRICE_FIELD} > 0
              AND ${DATE_EXPR} >= '${DATE_CUTOFF}'
          ),
          latest AS (
            SELECT *, ROW_NUMBER() OVER (
              PARTITION BY parcelid ORDER BY saledate DESC
            ) AS rn
            FROM recent
          )
          SELECT
            CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
            CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
            pid, parcelid, address, city, zipcode,
            saledate, saleprice
          FROM latest WHERE rn = 1
          ORDER BY saledate DESC;
          SQL

          echo "=== Query ==="
          cat data/query.sql

          OGR_EXIT=0
          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)" || OGR_EXIT=$?

          if [[ ! -f public/parcel_sales.csv ]]; then
            echo "::error ::ogr2ogr did not produce output (exit code: ${OGR_EXIT})"
            echo "=== Diagnostic ==="
            sqlite3 data/sales.gpkg "SELECT COUNT(*) FROM sales WHERE ${PRICE_FIELD} > 0 AND ${DATE_EXPR} >= '${DATE_CUTOFF}';"
            exit 1
          fi

          echo "Output rows: $(wc -l < public/parcel_sales.csv)"

      - name: Validate output
        run: |
          set -euo pipefail

          if [[ ! -f public/parcel_sales.csv ]]; then
            echo "::error ::public/parcel_sales.csv does not exist."
            exit 1
          fi

          # Check header
          HEADER=$(head -1 public/parcel_sales.csv)
          EXPECTED="lon,lat,pid,parcelid,address,city,zipcode,saledate,saleprice"
          if [[ "${HEADER}" != "${EXPECTED}" ]]; then
            echo "::error ::Header mismatch. Expected: ${EXPECTED}"
            echo "::error ::Got: ${HEADER}"
            exit 1
          fi

          ROW_COUNT=$(wc -l < public/parcel_sales.csv)
          TOTAL=$((ROW_COUNT - 1))
          echo "Output rows: ${TOTAL}"

          if (( TOTAL < 2 )); then
            echo "::error ::Output CSV is empty."
            exit 1
          fi
          if (( TOTAL < 5000 )); then
            echo "::warning ::Only ${TOTAL} rows — expected 15,000-20,000."
          fi
          if (( TOTAL > 50000 )); then
            echo "::warning ::${TOTAL} rows seems high — expected 15,000-20,000."
          fi

          # Address fill rate
          ADDR_FILLED=$(awk -F',' 'NR>1 && $5!="" {count++} END {print count+0}' public/parcel_sales.csv)
          echo "Rows with address data: ${ADDR_FILLED}/${TOTAL}"
          if (( ADDR_FILLED == 0 )); then
            echo "::warning ::No address data — all address fields empty."
          elif (( ADDR_FILLED * 100 / TOTAL < 80 )); then
            echo "::warning ::Address fill rate below 80% (${ADDR_FILLED}/${TOTAL})."
          fi

          # City coverage
          CITIES=$(awk -F',' 'NR>1 && $6!="" {print $6}' public/parcel_sales.csv | sort -u | wc -l)
          echo "Unique cities: ${CITIES}"
          if (( CITIES < 5 )); then
            echo "::warning ::Only ${CITIES} unique cities — expected 8-9 for Mecklenburg County."
          fi

          # Bounding box check (sample first 100 rows)
          BAD_COORDS=$(awk -F',' 'NR>1 && NR<=101 {
            if ($1 < -81.1 || $1 > -80.5 || $2 < 35.0 || $2 > 35.5) print NR": "$1","$2
          }' public/parcel_sales.csv)
          if [[ -n "${BAD_COORDS}" ]]; then
            echo "::warning ::Some coordinates outside Mecklenburg County bbox:"
            echo "${BAD_COORDS}" | head -5
          fi

          echo ""
          echo "Sample output:"
          head -5 public/parcel_sales.csv

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
