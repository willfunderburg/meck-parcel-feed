name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "15 10 * * 1"   # Mondays 10:15 UTC
  workflow_dispatch:

permissions:
  contents: write  # allow GITHUB_TOKEN to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip curl

      - name: Download and unzip Parcel_Sales
        run: |
          set -euo pipefail
          mkdir -p data/shp public
          curl -fL -o data/Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"
          unzip -o data/Parcel_Sales.zip -d data/shp

      - name: Reproject Parcel_Sales to GPKG (layer 'sales')
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326 -nln sales -overwrite

      - name: Download and load MAT (Master Address Table) as 'mat'
        run: |
          set -euo pipefail
          mkdir -p data/mat
          curl -fL -o data/MAT.zip "https://maps.mecknc.gov/opendata/MAT.zip"
          unzip -o data/MAT.zip -d data/mat
          MAT_SHP=$(ls data/mat/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$MAT_SHP" -t_srs EPSG:4326 -nln mat -overwrite

      - name: Inspect MAT fields (for troubleshooting)
        run: |
          ogrinfo -ro -so -al data/sales.gpkg mat

      - name: Build latest-per-parcel (last 12 months) CSV — optimized (attr join + small spatial fallback + filters)
        run: |
          set -euo pipefail

          # ---- SQLite perf knobs ----
          ogrinfo data/sales.gpkg -sql "PRAGMA cache_size = 200000" >/dev/null 2>&1 || true
          ogrinfo data/sales.gpkg -sql "PRAGMA temp_store = MEMORY"  >/dev/null 2>&1 || true
          ogrinfo data/sales.gpkg -sql "PRAGMA synchronous = OFF"    >/dev/null 2>&1 || true
          ogrinfo data/sales.gpkg -sql "PRAGMA journal_mode = OFF"   >/dev/null 2>&1 || true

          # ---- Helpful indexes ----
          ogrinfo data/sales.gpkg -sql "CREATE INDEX IF NOT EXISTS idx_sales_parcelid   ON sales(parcelid)"  || true
          ogrinfo data/sales.gpkg -sql "CREATE INDEX IF NOT EXISTS idx_sales_propertyid ON sales(propertyid)" || true
          ogrinfo data/sales.gpkg -sql "CREATE INDEX IF NOT EXISTS idx_mat_id_ncpin     ON mat(id_ncpin)"     || true
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('sales','geom')" || echo "sales spatial index present"
          ogrinfo data/sales.gpkg -sql "SELECT gpkgAddSpatialIndex('mat','geom')"   || echo "mat spatial index present"

          # ---- Query ----
          cat > data/query.sql <<'SQL'
          WITH recent AS (
            SELECT
              s.geom,
              s.parcelid,
              s.propertyid AS pid,
              printf('%010d', CAST(s.propertyid AS INTEGER)) AS pid_text,
              s.saleprice,
              s.saledate
            FROM sales s
            WHERE date(s.saledate) >= date('now','-12 months')
          ),
          latest AS (
            SELECT
              geom, parcelid, pid, pid_text, saleprice, saledate,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate) DESC
              ) AS rn
            FROM recent
          ),
          base AS ( SELECT * FROM latest WHERE rn = 1 ),

          -- Attribute join by PIN
          attr_join AS (
            SELECT
              b.parcelid, b.pid, b.pid_text, b.geom, b.saledate, b.saleprice,
              COALESCE(m.full_addre, m.address, '')  AS address,
              COALESCE(m.nme_city,  m.nme_po_cit, '') AS city,
              COALESCE(m.cde_zip1, '')               AS zipcode
            FROM base b
            LEFT JOIN mat m
              ON m.id_ncpin = b.pid_text
          ),

          -- Spatial fallback: nearest MAT point to centroid within ~60 m
          centroids AS (
            SELECT parcelid, pid, pid_text, saleprice, saledate, ST_Centroid(geom) AS cgeom
            FROM base
          ),
          spatial_fallback AS (
            SELECT
              c.parcelid,
              COALESCE(m.full_addre, m.address, '')  AS address,
              COALESCE(m.nme_city,  m.nme_po_cit, '') AS city,
              COALESCE(m.cde_zip1, '')               AS zipcode,
              Distance(c.cgeom, m.geom) AS dist
            FROM centroids c
            JOIN mat m
            WHERE MbrIntersects(
                    Envelope(c.cgeom),
                    BuildMbr(ST_X(c.cgeom)-0.002, ST_Y(c.cgeom)-0.002,
                             ST_X(c.cgeom)+0.002, ST_Y(c.cgeom)+0.002)
                  )
          ),
          spatial_pick AS (
            SELECT parcelid, address, city, zipcode
            FROM (
              SELECT parcelid, address, city, zipcode, dist,
                     ROW_NUMBER() OVER (PARTITION BY parcelid ORDER BY dist ASC) AS rnk
              FROM spatial_fallback
              WHERE dist <= 0.00054
            ) t
            WHERE rnk = 1
          ),

          -- Merge: prefer attribute-join, else spatial
          merged AS (
            SELECT
              a.pid, a.parcelid, a.geom, a.saledate, a.saleprice,
              CASE WHEN a.address IS NOT NULL AND TRIM(a.address) <> ''
                   THEN a.address ELSE COALESCE(sp.address,'') END AS address,
              CASE WHEN a.address IS NOT NULL AND TRIM(a.address) <> ''
                   THEN a.city    ELSE COALESCE(sp.city,'')    END AS city,
              CASE WHEN a.address IS NOT NULL AND TRIM(a.address) <> ''
                   THEN a.zipcode ELSE COALESCE(sp.zipcode,'') END AS zipcode
            FROM attr_join a
            LEFT JOIN spatial_pick sp ON sp.parcelid = a.parcelid
          )

          SELECT
            CAST(ST_X(ST_Centroid(geom)) AS REAL) AS lon,
            CAST(ST_Y(ST_Centroid(geom)) AS REAL) AS lat,
            pid,
            parcelid,
            address,
            city,
            zipcode,
            strftime('%Y-%m-%d', saledate) AS saledate,
            saleprice
          FROM merged
          WHERE saleprice > 0
            AND TRIM(COALESCE(address, '')) <> ''
          ORDER BY date(saledate) DESC;
          SQL

          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
