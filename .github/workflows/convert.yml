name: Build parcel sales CSV (weekly)

on:
  schedule:
    - cron: "15 10 * * 1"   # Mondays 10:15 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip unzip

      - name: Download and unzip shapefile
        run: |
          set -euo pipefail
          mkdir -p data/shp public
          curl -fL -o data/Parcel_Sales.zip "https://maps.mecknc.gov/opendata/Parcel_Sales.zip"
          unzip -o data/Parcel_Sales.zip -d data/shp

      - name: Reproject to WGS84 GeoPackage
        run: |
          set -euo pipefail
          SHP_FILE=$(ls data/shp/*.shp | head -n 1)
          ogr2ogr -f GPKG data/sales.gpkg "$SHP_FILE" -t_srs EPSG:4326
          # capture layer name (usually "1: <LayerName>")
          LAYER=$(ogrinfo -ro -so data/sales.gpkg | awk -F': ' '/1: /{print $2; exit}')
          echo "Detected layer: $LAYER"
          echo "$LAYER" > data/layer.txt

      - name: Build latest-per-parcel (last 12 months) CSV
        run: |
          set -euo pipefail
          LAYER=$(cat data/layer.txt)

          # Write SQL safely with a quoted heredoc so neither YAML nor Bash expands it
          cat > data/query.sql <<'SQL'
          WITH recent AS (
            SELECT
              geometry,
              pid,
              parcelid,
              address,
              city,
              zipcode,
              saleprice,
              -- normalize to YYYY-MM-DD; keep original if already in that format
              substr(saledate,1,10) AS saledate_norm
            FROM "{LAYER}"
            WHERE date(substr(saledate,1,10)) >= date('now','-12 months')
          ),
          ranked AS (
            SELECT
              CAST(ST_X(ST_Centroid(geometry)) AS REAL) AS lon,
              CAST(ST_Y(ST_Centroid(geometry)) AS REAL) AS lat,
              pid,
              parcelid,
              address,
              city,
              zipcode,
              saledate_norm AS saledate,
              saleprice,
              ROW_NUMBER() OVER (
                PARTITION BY parcelid
                ORDER BY date(saledate_norm) DESC
              ) AS rn
            FROM recent
          )
          SELECT
            lon, lat, pid, parcelid, address, city, zipcode, saledate, saleprice
          FROM ranked
          WHERE rn = 1
          ORDER BY date(saledate) DESC;
          SQL

          # Inject the real layer name into the SQL file
          sed -i "s/{LAYER}/$LAYER/g" data/query.sql

          # Run the SQL via OGR’s SQLite dialect
          ogr2ogr -f CSV public/parcel_sales.csv data/sales.gpkg \
            -dialect SQLite \
            -sql "$(cat data/query.sql)"

      - name: Commit CSV
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/parcel_sales.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/parcel_sales.csv
            git commit -m "Update parcel_sales.csv [weekly]"
            git push
          else
            echo "No changes this run."
          fi
